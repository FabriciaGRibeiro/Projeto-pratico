spring.application.name=helpdesk

# Data Vault — serviço externo de dados de clientes
# Substitua pela URL real do ambiente (dev, staging, prod)
datavault.base-url=http://data-vault-api

# Dados de conexão (batendo com o compose.yaml acima)
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk
spring.datasource.username=postgres
spring.datasource.password=password

# Hibernate & Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true